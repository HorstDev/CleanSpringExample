plugins {
    id 'java'
    id 'war' // для того, чтобы собирался как web приложение
}

group = 'com.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // Spring
    implementation("org.springframework:spring-context:5.3.39")
    // БД
    implementation("org.springframework:spring-jdbc:5.3.39")
    implementation("org.postgresql:postgresql:42.7.7")

    // Lombok
    implementation 'org.projectlombok:lombok:1.18.32' // Основная зависимость Lombok
    annotationProcessor 'org.projectlombok:lombok:1.18.32' // Для обработки аннотаций

    // Spring batch
    implementation("org.springframework.batch:spring-batch-core:4.3.10")
//    implementation("org.springframework.batch:spring-batch-infrastructure:5.2.2")
    // Транзакции
    implementation("org.springframework:spring-tx:5.3.39")



    // https://mvnrepository.com/artifact/org.springframework/spring-webmvc
    implementation("org.springframework:spring-webmvc:5.3.39")
    // tomcat
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:9.0.86'
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper:9.0.86'
    // servlets
    implementation 'javax.servlet:javax.servlet-api:4.0.1'
}

test {
    useJUnitPlatform()
}